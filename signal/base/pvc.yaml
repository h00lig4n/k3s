apiVersion: v1
kind: Service
metadata:
  name: signal
  namespace: common
  labels:
    app.kubernetes.io/name: signal
spec:
  type: ClusterIP
  selector:
    app: signal
  ports:
    - port: 8080
      targetPort: 8080
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signal
  namespace: common
  labels:
    app: signal
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 256Mi
