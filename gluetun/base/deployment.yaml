apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordvpn-proxy
  namespace: common
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: nordvpn-proxy
  template:
    metadata:
      labels:
        app: nordvpn-proxy
    spec:
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi  
          env:
            - name: VPN_SERVICE_PROVIDER
              value: nordvpn
            - name: VPN_TYPE
              value: openvpn
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: nordvpn
                  key: username
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nordvpn
                  key: password
            - name: OPENVPN_PROTOCOL
              value: tcp
            - name: SERVER_COUNTRIES
              value: Sweden
#            - name: SERVER_HOSTNAMES
#             value: se536.nordvpn.com
            - name: UPDATER_VPN_SERVICE_PROVIDERS
              value: nordvpn
            - name: UPDATER_PREFER_DIRECT_DOWNLOAD
              value: "yes"
            - name: UPDATER_PERIOD
              value: "480h"
            - name: HTTPPROXY
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8888"
          ports:
            - name: http-proxy
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: 9999
              host: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 9999
              host: 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
